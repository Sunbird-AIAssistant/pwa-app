<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <!-- <title>Application</title> -->

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="preload"  id="dynamic-favicon" href="assets/icon/favicon/favicon.png" as="image"/>
<link rel="preload"  href="assets/installPrompt.js" as="script"/>


  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>

  <meta name="theme-color" content="#1976d2">
  <!-- Optional: set content when hostname has no tenant prefix (e.g. single-domain deploy) -->
  <meta name="app-tenant-subdomain" content=""/>
  <script>
    function resolveAppTenantSubdomain() {
      function slug(s) {
        s = (s || '').trim();
        return /^[a-zA-Z0-9_-]+$/.test(s) ? s : '';
      }
      try {
        var sp = new URLSearchParams(window.location.search);
        var q = slug(sp.get('tenant') || sp.get('subdomain'));
        if (q) {
          try { sessionStorage.setItem('tenantSubdomain', q); } catch (e) {}
          return q;
        }
      } catch (e) {}
      try {
        var st = slug(sessionStorage.getItem('tenantSubdomain'));
        if (st) return st;
      } catch (e) {}
      var m = document.querySelector('meta[name="app-tenant-subdomain"]');
      var mc = slug(m && m.getAttribute('content'));
      if (mc) return mc;
      var host = (window.location.hostname || '').toLowerCase();
      if (!host) return '';
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) return '';
      var parts = host.split('.');
      if (parts.length >= 2) {
        if (parts[0] === 'www' && parts.length >= 3) return parts[1];
        return parts[0];
      }
      return parts[0] || '';
    }
    function setFavicon() {
      var sub = resolveAppTenantSubdomain();
      var el = document.getElementById('dynamic-favicon');
      if (!el) return;
      if (!sub) {
        el.href = 'assets/icon/favicon/favicon.png';
        return;
      }
      el.href = 'assets/icon/favicon/' + sub + '.png';
      el.onerror = function () { el.href = 'assets/icon/favicon/favicon.png'; };
    }
    document.addEventListener('DOMContentLoaded', setFavicon);
  </script>

  <style>
    #installButton {
      display: none; /* Initially hide the button */
      position: fixed;
      bottom: 80px;
      right: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <button id="installButton">Install App</button>

  <script src="assets/installPrompt.js" async></script>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
